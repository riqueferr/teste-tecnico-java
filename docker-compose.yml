services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cadastro
      POSTGRES_USER: cadastro
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env (copie de .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadastro -d cadastro"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/cadastro
      DB_USER: cadastro
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      APP_AUTH_USER: ${APP_AUTH_USER:?defina APP_AUTH_USER no .env}
      APP_AUTH_PASSWORD_HASH: ${APP_AUTH_PASSWORD_HASH:?defina APP_AUTH_PASSWORD_HASH no .env}
      APP_AUTH_JWT_SECRET: ${APP_AUTH_JWT_SECRET:?defina APP_AUTH_JWT_SECRET no .env}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
